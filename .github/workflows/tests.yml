name: Tests

# Checks every cask on each push and pull request: Homebrew's audit and
# style, then an install and uninstall on macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout as scrambletools/tap
        run: |
          taps="$(brew --repository)/Library/Taps/scrambletools"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          # Homebrew loads a tap's casks only once it is trusted.
          brew trust --tap scrambletools/tap
      - run: brew style scrambletools/tap
      - run: brew audit --strict --online --tap scrambletools/tap
      - name: Install and uninstall each cask
        run: |
          for file in Casks/*.rb; do
            cask="scrambletools/tap/$(basename "$file" .rb)"
            brew install --cask "$cask"
            brew uninstall --cask "$cask"
          done
